<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Program</title>
<meta name="theme-color" content="#0f172a">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0a0f1e;
    --bg2: #111827;
    --bg3: #1e293b;
    --border: #1e3a5f;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --schimb-bg: #1e3a5f;
    --schimb-border: #1d4ed8;
    --liber-bg: #14532d;
    --liber-border: #166534;
    --co-bg: #3b0764;
    --co-border: #7c3aed;
    --today: #f59e0b;
    --danger: #ef4444;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app-shell { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* HEADER */
  header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left h1 {
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.15em;
    color: var(--accent2);
    text-transform: uppercase;
  }

  .header-left p {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* NAV TABS */
  .nav-tabs {
    display: flex;
    gap: 4px;
    padding: 16px 20px 0;
  }

  .nav-tab {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 0;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
  }

  .nav-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* MONTH NAVIGATOR */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 0;
  }

  .month-nav button {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }

  .month-nav button:hover { background: var(--accent); border-color: var(--accent); }

  .month-title {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    letter-spacing: 0.05em;
    color: var(--text);
    text-align: center;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 6px;
    padding: 10px 20px 0;
  }

  .stat-chip {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 6px;
    text-align: center;
  }

  .stat-chip .sv {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .stat-chip .sl {
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
  }

  .stat-chip.s-schimb .sv { color: var(--accent2); }
  .stat-chip.s-liber .sv { color: #4ade80; }
  .stat-chip.s-co .sv { color: #c084fc; }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 10px;
    padding: 8px 20px 0;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text2);
  }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* CALENDAR GRID */
  .calendar-container { padding: 10px 20px 0; flex: 1; }

  .weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 5px;
  }

  .weekday-header span {
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    padding: 3px 0;
  }

  .weekday-header span.weekend { color: var(--accent2); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .day-cell {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    transition: all 0.15s;
    background: var(--bg3);
    overflow: hidden;
    min-height: 42px;
  }

  .day-cell:hover { border-color: var(--accent); transform: scale(1.05); z-index: 2; }
  .day-cell.empty { background: transparent; cursor: default; pointer-events: none; }
  .day-cell.today { border-color: var(--today) !important; box-shadow: 0 0 10px rgba(245,158,11,0.3); }

  .day-cell.type-schimb { background: var(--schimb-bg); border-color: var(--schimb-border); }
  .day-cell.type-liber  { background: var(--liber-bg);  border-color: var(--liber-border); }
  .day-cell.type-co     { background: var(--co-bg);     border-color: var(--co-border); }

  .day-num {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }

  .day-cell.type-schimb .day-num { color: var(--accent2); }
  .day-cell.type-liber  .day-num { color: #4ade80; }
  .day-cell.type-co     .day-num { color: #c084fc; }
  .day-cell.today       .day-num { color: var(--today); }

  .day-label {
    font-size: 7px;
    text-align: center;
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 2px;
  }

  .day-cell.type-schimb .day-label { color: var(--accent2); }
  .day-cell.type-liber  .day-label { color: #4ade80; }
  .day-cell.type-co     .day-label { color: #c084fc; }

  /* WEEK VIEW */
  .week-container { padding: 12px 20px 0; }

  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .week-nav button {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }

  .week-nav button:hover { background: var(--accent); border-color: var(--accent); }

  .week-range {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    text-align: center;
  }

  .week-list { display: flex; flex-direction: column; gap: 6px; }

  .week-row {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .week-row::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border);
    border-radius: 2px 0 0 2px;
  }

  .week-row.type-schimb::before { background: var(--accent); }
  .week-row.type-liber::before  { background: #4ade80; }
  .week-row.type-co::before     { background: #c084fc; }
  .week-row:hover { border-color: var(--accent); transform: translateX(2px); }
  .week-row.today-row { border-color: var(--today); }

  .week-row-date { min-width: 40px; text-align: center; }
  .week-row-date .wd { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
  .week-row-date .dd { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; line-height: 1; color: var(--text); }
  .week-row.today-row .dd { color: var(--today); }
  .week-row-info { flex: 1; min-width: 0; }
  .week-row-type { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .week-row.type-schimb .week-row-type { color: var(--accent2); }
  .week-row.type-liber  .week-row-type { color: #4ade80; }
  .week-row.type-co     .week-row-type { color: #c084fc; }
  .week-row.type-none   .week-row-type { color: var(--text3); }
  .week-row-detail { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-row-icon { font-size: 22px; flex-shrink: 0; }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px 36px;
    width: 100%;
    max-width: 480px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 92vh;
    overflow-y: auto;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-date {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 2px;
  }

  .modal-date-sub { font-size: 11px; color: var(--text3); margin-bottom: 16px; }

  .modal-section { margin-bottom: 16px; }

  .modal-label {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    margin-bottom: 8px;
  }

  /* Tip zi butoane */
  .type-btns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .type-btn {
    padding: 10px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    line-height: 1.4;
  }

  .type-btn:hover { border-color: var(--accent); color: var(--text); }
  .type-btn.sel-schimb { background: var(--schimb-bg); border-color: var(--accent); color: var(--accent2); }
  .type-btn.sel-liber  { background: var(--liber-bg);  border-color: #4ade80; color: #4ade80; }
  .type-btn.sel-co     { background: var(--co-bg);     border-color: #c084fc; color: #c084fc; }

  /* Ore */
  .time-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .time-field { flex: 1; }
  .time-field label { display: block; font-size: 10px; color: var(--text3); margin-bottom: 5px; letter-spacing: 0.06em; text-transform: uppercase; }

  .time-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.15s;
    text-align: center;
  }

  .time-input:focus { border-color: var(--accent); }
  .time-sep { color: var(--text3); font-size: 22px; font-family: 'Space Mono', monospace; padding-top: 18px; }

  /* Post de lucru — buton principal + dropdown */
  .post-trigger {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.15s;
  }

  .post-trigger.has-value { border-color: var(--accent); color: var(--text); }
  .post-trigger:hover { border-color: var(--accent2); }

  .post-trigger .arrow { transition: transform 0.2s; font-size: 12px; }
  .post-trigger.open .arrow { transform: rotate(180deg); }

  .post-dropdown {
    display: none;
    flex-direction: column;
    gap: 4px;
    margin-top: 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }

  .post-dropdown.open { display: flex; }

  .post-option {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.1s;
    border: none;
    background: none;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    border-bottom: 1px solid var(--border);
  }

  .post-option:last-child { border-bottom: none; }
  .post-option:hover { background: var(--schimb-bg); color: var(--accent2); }
  .post-option.active { background: var(--schimb-bg); color: var(--accent2); font-weight: 600; }

  /* Acțiuni */
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .btn-save {
    flex: 1;
    padding: 13px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-save:hover { background: var(--accent2); }

  .btn-clear {
    padding: 13px 18px;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-clear:hover { background: rgba(239,68,68,0.1); }

  .bottom-spacer { height: 24px; }
</style>
</head>
<body>
<div class="app-shell">

  <header>
    <div class="header-left">
      <h1>▶ Program</h1>
      <p>Controlor · Schimbul 2</p>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="setView('luna')">📅 Lună</button>
    <button class="nav-tab" onclick="setView('saptamana')">📋 Săptămână</button>
  </div>

  <!-- LUNA -->
  <div id="viewLuna">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="monthTitle">–</div>
      <button onclick="changeMonth(1)">›</button>
    </div>

    <div class="stats-bar" id="statsBar"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Schimb</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Liber</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c084fc"></div>CO</div>
    </div>

    <div class="calendar-container">
      <div class="weekday-header">
        <span>LU</span><span>MA</span><span>MI</span><span>JO</span><span>VI</span>
        <span class="weekend">SÂ</span><span class="weekend">DU</span>
      </div>
      <div class="calendar-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- SAPTAMANA -->
  <div id="viewSaptamana" style="display:none">
    <div class="week-container">
      <div class="week-nav">
        <button onclick="changeWeek(-1)">‹</button>
        <div class="week-range" id="weekRange">–</div>
        <button onclick="changeWeek(1)">›</button>
      </div>
      <div class="week-list" id="weekList"></div>
    </div>
  </div>

  <div class="bottom-spacer"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-date" id="modalDate">–</div>
    <div class="modal-date-sub" id="modalDateSub">–</div>

    <!-- Tip zi -->
    <div class="modal-section">
      <div class="modal-label">Tip zi</div>
      <div class="type-btns">
        <button class="type-btn" id="btnSchimb" onclick="selType('schimb')">🚉<br>Schimb</button>
        <button class="type-btn" id="btnLiber"  onclick="selType('liber')">🏠<br>Liber</button>
        <button class="type-btn" id="btnCO"     onclick="selType('co')">✈️<br>CO</button>
      </div>
    </div>

    <!-- Detalii schimb -->
    <div id="schimbDetails" style="display:none">

      <!-- Ore -->
      <div class="modal-section">
        <div class="modal-label">Interval orar</div>
        <div class="time-row">
          <div class="time-field">
            <label>Ora început</label>
            <input class="time-input" type="time" id="timeStart" value="14:00">
          </div>
          <span class="time-sep">—</span>
          <div class="time-field">
            <label>Ora sfârșit</label>
            <input class="time-input" type="time" id="timeEnd" value="23:30">
          </div>
        </div>
      </div>

      <!-- Cap de linie -->
      <div class="modal-section">
        <div class="modal-label">Cap de linie</div>
        <button class="post-trigger" id="postTrigger" onclick="togglePostDropdown()">
          <span id="postTriggerLabel">Selectează capul de linie...</span>
          <span class="arrow">▼</span>
        </button>
        <div class="post-dropdown" id="postDropdown">
          <button class="post-option" onclick="selPost('Romprim')">🚏 Romprim</button>
          <button class="post-option" onclick="selPost('Șura Mare')">🚏 Șura Mare</button>
          <button class="post-option" onclick="selPost('CFR Progresul')">🚏 CFR Progresul</button>
          <button class="post-option" onclick="selPost('Zetari')">🚏 Zetari</button>
          <button class="post-option" onclick="selPost('Piața Reșița')">🚏 Piața Reșița</button>
          <button class="post-option" onclick="selPost('Arcade Berceni')">🚏 Arcade Berceni</button>
          <button class="post-option" onclick="selPost('Bd. Obregia')">🚏 Bd. Obregia</button>
        </div>
      </div>

    </div>

    <div class="modal-actions">
      <button class="btn-save" onclick="saveDay()">✓ Salvează</button>
      <button class="btn-clear" onclick="clearDay()">✕ Șterge</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'cap_linie_v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { data = {}; }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  function dayKey(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

  const MONTHS_RO = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
  const DAYS_RO   = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];

  let now = new Date();
  let curYear = now.getFullYear(), curMonth = now.getMonth();
  let currentView = 'luna', weekOffset = 0;

  function setView(v) {
    currentView = v;
    document.querySelectorAll('.nav-tab').forEach((t,i) =>
      t.classList.toggle('active', (i===0&&v==='luna')||(i===1&&v==='saptamana'))
    );
    document.getElementById('viewLuna').style.display      = v==='luna' ? '' : 'none';
    document.getElementById('viewSaptamana').style.display = v==='saptamana' ? '' : 'none';
    v==='saptamana' ? renderWeek() : renderMonth();
  }

  // ── LUNA ──
  function changeMonth(d) {
    curMonth += d;
    if(curMonth<0){curMonth=11;curYear--;}
    if(curMonth>11){curMonth=0;curYear++;}
    renderMonth();
  }

  function renderMonth() {
    document.getElementById('monthTitle').textContent = `${MONTHS_RO[curMonth]} ${curYear}`;
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    let startDow = new Date(curYear, curMonth, 1).getDay();
    startDow = startDow===0 ? 6 : startDow-1;

    const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
    const todayStr = dayKey(now.getFullYear(), now.getMonth(), now.getDate());
    let counts = {schimb:0, liber:0, co:0};

    for(let i=0;i<startDow;i++){
      const e=document.createElement('div'); e.className='day-cell empty'; grid.appendChild(e);
    }

    for(let d=1;d<=daysInMonth;d++){
      const k=dayKey(curYear,curMonth,d);
      const day=data[k]||{};
      const cell=document.createElement('div');
      cell.className='day-cell';
      if(day.type) { cell.classList.add('type-'+day.type); counts[day.type]=(counts[day.type]||0)+1; }
      if(k===todayStr) cell.classList.add('today');

      let label='';
      if(day.type==='schimb') label=`<div class="day-label">${day.post||'Schimb'}</div>`;
      else if(day.type==='liber') label=`<div class="day-label">Liber</div>`;
      else if(day.type==='co')    label=`<div class="day-label">CO</div>`;

      cell.innerHTML=`<div class="day-num">${d}</div>${label}`;
      cell.onclick=()=>openModal(curYear,curMonth,d);
      grid.appendChild(cell);
    }

    document.getElementById('statsBar').innerHTML=`
      <div class="stat-chip s-schimb"><div class="sv">${counts.schimb||0}</div><div class="sl">Schimb</div></div>
      <div class="stat-chip s-liber"><div class="sv">${counts.liber||0}</div><div class="sl">Liber</div></div>
      <div class="stat-chip s-co"><div class="sv">${counts.co||0}</div><div class="sl">CO</div></div>
    `;
  }

  // ── SAPTAMANA ──
  function getMondayOfWeek(offset) {
    const d=new Date(now);
    const dow=d.getDay()===0?6:d.getDay()-1;
    d.setDate(d.getDate()-dow+offset*7);
    d.setHours(0,0,0,0);
    return d;
  }

  function changeWeek(d) { weekOffset+=d; renderWeek(); }

  function renderWeek() {
    const mon=getMondayOfWeek(weekOffset);
    const sun=new Date(mon); sun.setDate(sun.getDate()+6);
    const fmt=d=>`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
    document.getElementById('weekRange').textContent=`${fmt(mon)} – ${fmt(sun)} ${sun.getFullYear()}`;

    const todayStr=dayKey(now.getFullYear(),now.getMonth(),now.getDate());
    const list=document.getElementById('weekList');
    list.innerHTML='';
    const WD=['Lu','Ma','Mi','Jo','Vi','Sâ','Du'];
    const ICONS={schimb:'🚉',liber:'🏠',co:'✈️',none:'·'};
    const LABELS={schimb:'Schimb',liber:'Liber',co:'Concediu',none:'Necompletat'};

    for(let i=0;i<7;i++){
      const d=new Date(mon); d.setDate(d.getDate()+i);
      const k=dayKey(d.getFullYear(),d.getMonth(),d.getDate());
      const day=data[k]||{};
      const type=day.type||'none';
      const row=document.createElement('div');
      row.className=`week-row type-${type}`;
      if(k===todayStr) row.classList.add('today-row');

      let detail='';
      if(type==='schimb'){
        const parts=[];
        if(day.post) parts.push(day.post);
        if(day.start&&day.end) parts.push(`${day.start}–${day.end}`);
        detail=parts.join(' · ')||'Schimb 2 · 14:00–23:30';
      } else if(type==='co') detail='Concediu de odihnă';
      else if(type==='liber') detail='Zi liberă';
      else detail='Apasă pentru a completa';

      row.innerHTML=`
        <div class="week-row-date">
          <div class="wd">${WD[i]}</div>
          <div class="dd">${d.getDate()}</div>
        </div>
        <div class="week-row-info">
          <div class="week-row-type">${LABELS[type]}</div>
          <div class="week-row-detail">${detail}</div>
        </div>
        <div class="week-row-icon">${ICONS[type]}</div>
      `;
      row.onclick=()=>openModal(d.getFullYear(),d.getMonth(),d.getDate());
      list.appendChild(row);
    }
  }

  // ── MODAL ──
  let modalKey=null, selectedType=null, selectedPost=null;

  function openModal(y,m,d){
    modalKey=dayKey(y,m,d);
    const day=data[modalKey]||{};
    selectedType=day.type||'schimb';
    selectedPost=day.post||null;

    const dt=new Date(y,m,d);
    document.getElementById('modalDate').textContent=`${DAYS_RO[dt.getDay()]}, ${d} ${MONTHS_RO[m]} ${y}`;
    document.getElementById('modalDateSub').textContent=modalKey;
    document.getElementById('timeStart').value=day.start||'14:00';
    document.getElementById('timeEnd').value=day.end||'23:30';

    // Închide dropdown-ul
    document.getElementById('postDropdown').classList.remove('open');
    document.getElementById('postTrigger').classList.remove('open');

    updateTypeBtns();
    updatePostTrigger();
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModalOutside(e){ if(e.target===document.getElementById('modalOverlay')) closeModal(); }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

  function selType(t){
    selectedType=selectedType===t?null:t;
    if(selectedType!=='schimb') selectedPost=null;
    updateTypeBtns();
    updatePostTrigger();
    // Închide dropdown când se schimbă tipul
    document.getElementById('postDropdown').classList.remove('open');
    document.getElementById('postTrigger').classList.remove('open');
  }

  function updateTypeBtns(){
    document.getElementById('btnSchimb').className='type-btn'+(selectedType==='schimb'?' sel-schimb':'');
    document.getElementById('btnLiber').className='type-btn'+(selectedType==='liber'?' sel-liber':'');
    document.getElementById('btnCO').className='type-btn'+(selectedType==='co'?' sel-co':'');
    document.getElementById('schimbDetails').style.display=selectedType==='schimb'?'':'none';
  }

  function togglePostDropdown(){
    const dd=document.getElementById('postDropdown');
    const tr=document.getElementById('postTrigger');
    dd.classList.toggle('open');
    tr.classList.toggle('open');
  }

  function selPost(post){
    selectedPost=post;
    document.getElementById('postDropdown').classList.remove('open');
    document.getElementById('postTrigger').classList.remove('open');
    updatePostTrigger();
    // actualizează și opțiunile active
    document.querySelectorAll('.post-option').forEach(b=>{
      b.classList.toggle('active', b.textContent.trim().replace(/^🚏\s*/,'')===post);
    });
  }

  function updatePostTrigger(){
    const tr=document.getElementById('postTrigger');
    const lbl=document.getElementById('postTriggerLabel');
    if(selectedPost){
      lbl.textContent='🚏 '+selectedPost;
      tr.classList.add('has-value');
    } else {
      lbl.textContent='Selectează capul de linie...';
      tr.classList.remove('has-value');
    }
    // sync opțiuni active
    document.querySelectorAll('.post-option').forEach(b=>{
      b.classList.toggle('active', b.textContent.trim().replace(/^🚏\s*/,'')===selectedPost);
    });
  }

  function saveDay(){
    if(!modalKey) return;
    if(!selectedType){ delete data[modalKey]; }
    else {
      const d={type:selectedType};
      if(selectedType==='schimb'){
        d.start=document.getElementById('timeStart').value;
        d.end=document.getElementById('timeEnd').value;
        if(selectedPost) d.post=selectedPost;
      }
      data[modalKey]=d;
    }
    save();
    closeModal();
    currentView==='luna'?renderMonth():renderWeek();
  }

  function clearDay(){
    if(modalKey){ delete data[modalKey]; save(); }
    closeModal();
    currentView==='luna'?renderMonth():renderWeek();
  }

  renderMonth();
</script>
</body>
</html>
